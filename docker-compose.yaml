# nginx proxy address - http://172.17.0.1:64133

name: caprover
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: caprover/caprover:latest
    container_name: caprover-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      ACCEPTED_TERMS: ${CAPROVER_ACCEPTED_TERMS:-true}
      MAIN_NODE_IP_ADDRESS: ${CAPROVER_MAIN_NODE_IP:-}
      CONTAINER_NAME: caprover-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64133:3000'
    volumes:
      - './volumes/data/caprover:/var/lib/caprover'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - caprover

networks:
  caprover:
    name: caprover
    external: false
